name: Deploy

# Deploys to Railway on a push to main. main is only ever reached through a PR that
# passed the required CI checks (branch protection), so a push here is already
# CI-verified. Inert until the RAILWAY_TOKEN secret is set.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'design-system/**'
      - '**/Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skipping deploy."
            echo "Create a Railway project token (Project → Settings → Tokens) and add it"
            echo "as the repo secret RAILWAY_TOKEN to enable continuous deployment."
            exit 0
          fi
          npm i -g @railway/cli
          SHA="${{ github.sha }}"
          # Bake the deployed commit into the image (served at /version.txt), so we can confirm the
          # new code actually went live rather than trusting `railway up`'s build-log stream.
          echo "$SHA" > version.txt
          # Trigger the deploy. Tolerate a nonzero exit: `railway up --ci` returns 1 when it cannot
          # stream build logs even though the build and deploy succeed, so the version poll below is
          # the real pass/fail, not this exit code. One service: the Quiztin host serves /api and the
          # SPA (spec 0007).
          railway up --service quiztin --ci || echo "railway up exited nonzero; confirming by the deployed version instead."
          # Confirm the new code is live: poll the public URL until /version.txt reports this commit.
          # A failed build leaves the previous deployment serving (old or no version.txt), so this
          # times out and fails — which is the point: a stale deploy must not read as success.
          echo "Waiting for $SHA to go live at /version.txt ..."
          for i in $(seq 1 60); do
            sleep 15
            LIVE=$(curl -fsS --max-time 10 https://quiztin-production.up.railway.app/version.txt 2>/dev/null | tr -d '[:space:]' || true)
            echo "  check $i: live version = ${LIVE:-<none>}"
            if [ "$LIVE" = "$SHA" ]; then
              echo "Deploy confirmed live: $SHA"
              exit 0
            fi
          done
          echo "::error::Timed out after ~15 min waiting for $SHA to go live. The deploy did not land."
          exit 1
